[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "worker"
version = "0.1.0"
description = "Worker de importação e conciliação de documentos fiscais (PGDAS-D e Alterdata)"
requires-python = ">=3.12"
dependencies = [
  "pdfplumber>=0.11",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "reportlab>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "samples: requer os PDFs reais em SAMPLES_DIR (fora do Git)",
  "db: requer o Postgres do Supabase local (npx supabase start)",
]
